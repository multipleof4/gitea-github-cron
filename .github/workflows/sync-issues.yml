name: Sync issues to Gitea

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # 3 AM CDT

concurrency:
  group: sync-issues

jobs:
  issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Copy GitHub issues and PRs to Gitea mirrors
        id: sync
        run: node sync-issues.js
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ secrets.GITEA_URL }}

      - name: Notify via ntfy
        if: ${{ always() }}
        run: node notify.js
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          WORKFLOW_KIND: issues
          STEP_OUTCOME: ${{ steps.sync.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
