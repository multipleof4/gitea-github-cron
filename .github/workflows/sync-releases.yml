name: Sync releases to Gitea

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */4 * * *' # Every 4 hours, 30 min after the mirror run

concurrency:
  group: sync-releases

jobs:
  releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Copy GitHub releases to Gitea mirrors
        id: sync
        run: node sync-releases.js
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ secrets.GITEA_URL }}

      - name: Notify via ntfy
        if: ${{ always() }}
        run: node notify.js
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          WORKFLOW_KIND: releases
          STEP_OUTCOME: ${{ steps.sync.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
